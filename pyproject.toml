[project]
name = "webrag"
version = "2.0.0"
description = "Grounded, change-aware Q&A over live web pages."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
webrag = "webrag.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["webrag*"]

[tool.setuptools.package-data]
webrag = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
